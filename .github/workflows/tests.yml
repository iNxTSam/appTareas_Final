name: Tests

on:
  push:
    branches: [main, Backend, Frontend, Experimentar]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP 8.4 - PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, bcmath, intl, pcntl, zip
          coverage: none

      - name: Cache de dependencias de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar archivo de entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar la suite de pruebas
        run: vendor/bin/phpunit --testdox
